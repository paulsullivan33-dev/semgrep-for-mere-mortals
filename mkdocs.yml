site_name: Semgrep for Mere Mortals
site_description: A code scanner that reads your programs the way you wrote them. Writing rules that find injection flaws, unsafe calls and bad habits in Python, JavaScript and shell, reading findings, silencing the false ones, and knowing what a pattern cannot see.
